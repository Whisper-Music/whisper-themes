name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: index.json совпадает с темами
        run: node tools/build-index.js --check
